openapi: 3.0.3
info:
  title: SendLime APIs
  description: |
    SendLime Messaging API v2 — Send SMS and WhatsApp messages programmatically.

    ## Authentication
    All API requests require a Bearer token in the `Authorization` header.
    Generate your API key from the [Dashboard](https://dash.sendlime.com/dashboard/api-keys).

    ```
    Authorization: Bearer sl_live_your_key_here
    ```
  version: "2.0.0"
  contact:
    name: SendLime Support
    url: https://sendlime.com

servers:
  - url: https://api.sendlime.com/api/v2
    description: Production

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "API key starting with `sl_live_`"

  schemas:
    SendMessageRequest:
      type: object
      required:
        - to
        - message
      properties:
        to:
          type: string
          description: Recipient phone number in E.164 format
          example: "8801XXXXXXXXX"
        message:
          type: string
          description: The message body to send
          example: "Hello from SendLime!"
        channel:
          type: string
          enum: [sms, whatsapp]
          default: sms
          description: Message channel
          example: "sms"
        brand_id:
          type: string
          description: "Brand name or ID for sender identity. For masking SMS, pass your approved brand name. For non-masking SMS, pass your registered phone number. Optional — if omitted, the system default number is used."
          example: "YourBrandName"

    SendMessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            gateway_id:
              type: string
              description: Unique message identifier from the gateway
              example: "msg_5f8a1b2c3d4e"
            to:
              type: string
              example: "8801XXXXXXXXX"
            channel:
              type: string
              enum: [sms, whatsapp]
              example: "sms"
            status:
              type: string
              enum: [delivered, failed]
              example: "delivered"
            credits_remaining:
              type: number
              example: 99.5

    MessageLog:
      type: object
      properties:
        id:
          type: string
          example: "clx1abc2def3ghi4"
        recipient:
          type: string
          example: "8801XXXXXXXXX"
        message:
          type: string
          example: "Hello from SendLime!"
        channel:
          type: string
          enum: [non-mask, whatsapp]
          example: "non-mask"
        status:
          type: string
          enum: [delivered, failed]
          example: "delivered"
        price:
          type: string
          example: "0.5"
        gatewayId:
          type: string
          nullable: true
          example: "msg_5f8a1b2c3d4e"
        errorMessage:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2025-03-15T10:30:00.000Z"

    MessageLogsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/MessageLog"
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 50

    BalanceResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            balance:
              type: number
              example: 150.0
            currency:
              type: string
              example: "BDT"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid or revoked API key"

    InsufficientBalanceError:
      type: object
      properties:
        error:
          type: string
          example: "Insufficient balance"
        required:
          type: number
          example: 0.5
        available:
          type: number
          example: 0

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            to: ["Recipient number is required"]
            message: ["Message body is required"]

paths:
  /messages:
    post:
      operationId: sendMessage
      summary: Send Message
      description: |
        Send an SMS or WhatsApp message to a recipient.

        - Set `channel` to `"sms"` or `"whatsapp"`
        - For **masking SMS**, pass your approved brand name as `brand_id`
        - For **non-masking SMS**, pass your registered phone number as `brand_id`
        - If `brand_id` is omitted, the system default number is used
        - SMS messages deduct credits from your balance
      tags:
        - Messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            examples:
              sms_masking:
                summary: Send SMS (masking)
                value:
                  to: "8801XXXXXXXXX"
                  message: "Hello from SendLime!"
                  channel: "sms"
                  brand_id: "YourBrandName"
              sms:
                summary: Send SMS (non-masking)
                value:
                  to: "8801XXXXXXXXX"
                  message: "Hello from SendLime!"
                  channel: "sms"
              whatsapp:
                summary: Send WhatsApp
                value:
                  to: "8801XXXXXXXXX"
                  message: "Hello via WhatsApp!"
                  channel: "whatsapp"
      responses:
        "200":
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Recipient number is not on WhatsApp"
        "401":
          description: Unauthorized — missing, invalid, or revoked API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Invalid or revoked API key"
        "402":
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalanceError"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Error sending cellular message"
                status: "failed"

    get:
      operationId: getMessageLogs
      summary: Message Logs
      description: |
        Retrieve your sent message history with pagination and optional date filtering.

        Both `from` and `to` query parameters must be provided together for date filtering.
      tags:
        - Messages
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Number of results per page (max 200)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: "Start date filter (ISO 8601, e.g. 2025-01-01)"
          example: "2025-01-01"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: "End date filter (ISO 8601, e.g. 2025-01-31)"
          example: "2025-01-31"
      responses:
        "200":
          description: Message logs retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageLogsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /balance:
    get:
      operationId: getBalance
      summary: Check Balance
      description: Retrieve your current account balance.
      tags:
        - Account
      responses:
        "200":
          description: Balance retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

tags:
  - name: Messages
    description: Send and retrieve messages
  - name: Account
    description: Account management
